[project]
name = "kv-pipeline"
version = "0.1.0"
description = "Unified benchmarking pipeline for KV-cache optimization techniques on consumer GPUs"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "vllm==0.6.2",
    "torch>=2.4.0",
    "transformers==4.45.2",
    "accelerate",
    "pynvml",
    "psutil",        # host RSS measurement (CPU RAM used by offloaded KV cache)
    "matplotlib",
    "pandas",
    "numpy",
    "lmcache==0.3.10",
    "lmcache-vllm==0.6.2.3",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]
override-dependencies = ["transformers==4.45.2"]
